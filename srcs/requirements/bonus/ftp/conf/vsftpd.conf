listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES

dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

ftpd_banner="FTP SERVER OUIIIIIIIIIIII"

chroot_local_user=YES
allow_writeable_chroot=YES

secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

rsa_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
rsa_private_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
ssl_enable=NO

port_enable=YES
ftp_data_port=20
background=NO

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=__FTP_HOST__