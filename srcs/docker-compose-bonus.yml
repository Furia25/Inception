include:
  - path: ./docker-compose.yml

services:
  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    restart: always
    networks:
      - inception
  wordpress:
    environment:
      ENABLE_REDIS: "true"
    depends_on:
      - redis
  static:
    build: ./requirements/bonus/static
    container_name: static
    restart: always
    ports:
      - "666:666"
    volumes:
      - static-volume:/var/www/html
    networks:
      - inception
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}

volumes:
  static-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER:-vdurand}/data/static